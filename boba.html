<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grass Clicker</title>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            background-color: turquoise;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .counter {
            font-size: 28px;
            color: white;
            font-weight: bold;
            margin-bottom: 20px;
            z-index: 2;
        }

        .game-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shine-effect {
            position: absolute;
            width: 500px;
            height: 500px;
            animation: rotate-shine 10s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes rotate-shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .oscillate-image {
            width: 200px;
            transform-origin: center center;
            animation: oscillate 2s ease-in-out infinite;
        }

        @keyframes oscillate {
            0% { transform: rotate(-20deg) scale(1); }
            50% { transform: rotate(20deg) scale(1.1); }
            100% { transform: rotate(-20deg) scale(1); }
        }

        .image-button {
            cursor: pointer;
            background-color: transparent;
            border: none;
            padding: 0;
            position: relative;
            z-index: 2;
            transition: transform 0.1s ease;
        }

        .image-button:active {
            transform: scale(0.90); 
        }

        .image-button:active .oscillate-image {
            filter: brightness(1.3);
        }
    </style>
</head>
<body>

    <div class="counter">Count: <span id="score">0</span></div>

    <div class="game-container">
        <!-- Simple rotating image tag -->
        <img src="shine.png" alt="shine" class="shine-effect">
        <button class="image-button" id="click-btn">
            <img src="grass.webp" alt="GRASS" class="oscillate-image">
        </button>
    </div>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score');
        const clickBtn = document.getElementById('click-btn');

        clickBtn.addEventListener('click', () => {
            score++;
            scoreDisplay.textContent = score;
        });
    </script>

</body>
</html>
